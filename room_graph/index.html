<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#f3f5fa;--panel:#fff;--ink:#1d2433;--mut:#6b7280;--line:#dfe5ef;--accent:#2f6fed;--dot:#cdd5e4;--warn:#d98a00}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--panel:#1a2030;--ink:#e6eaf2;--mut:#9aa4b8;--line:#2a3347;--accent:#6ea0ff;--dot:#27304a;--warn:#f0a93b}}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;color:var(--ink);background:transparent}
#app{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
#pal{width:222px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#pal .top{padding:11px 11px 4px}#pal h4{margin:0 0 3px;font-size:14px}#pal p{margin:0 0 8px;font-size:11.5px;color:var(--mut);line-height:1.35}
#q{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13px}
#list{overflow:auto;padding:0 11px 12px;flex:1}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:13px 2px 5px;font-weight:600}
.pi{display:flex;align-items:center;gap:8px;padding:6px 9px;margin:3px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:grab;font-size:13px;user-select:none}
.pi:hover{border-color:var(--accent);transform:translateX(2px)}.pi i{width:9px;height:9px;border-radius:3px;flex:none}.pi small{margin-left:auto;color:var(--mut);font-size:10.5px}
#cv{position:relative;flex:1;overflow:hidden;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.3px);background-size:24px 24px}
svg#ed{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;width:178px;background:var(--panel);border:1.5px solid var(--line);border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.13);user-select:none;transition:box-shadow .15s}
.node.sel{box-shadow:0 0 0 2.5px var(--accent),0 6px 18px rgba(0,0,0,.2)}.node.iso{border-style:dashed;border-color:var(--warn)}
.node .hd{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;cursor:move;border-top:5px solid var(--c);border-radius:12px 12px 0 0}
.node .ico{font-size:19px;line-height:1}.node .nm{flex:1;min-width:0;border:1px solid transparent;background:transparent;color:var(--ink);font-weight:650;font-size:13.5px;padding:2px 4px;border-radius:6px}
.node .nm:hover,.node .nm:focus{border-color:var(--line);background:var(--bg);outline:none}
.node .x{border:none;background:transparent;color:var(--mut);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:6px}.node .x:hover{background:rgba(217,83,79,.15);color:#d9534f}
.node .bd{padding:0 9px}.node select{width:100%;font-size:11.5px;padding:3px 4px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.node .sz{display:flex;align-items:center;gap:6px;padding:6px 9px 2px;font-size:11px;color:var(--mut)}.node .sz input{flex:1;accent-color:var(--accent);height:14px}.node .sz b{width:34px;text-align:right;color:var(--ink)}
.node .ft{display:flex;align-items:center;gap:6px;padding:4px 9px 8px}.node .ent{font-size:11px;border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:99px;padding:2px 9px;cursor:pointer}
.node .ent.on{background:#a63603;border-color:#a63603;color:#fff}.node .tag{font-size:10.5px;color:var(--warn);margin-left:auto}
.node .port{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);cursor:crosshair;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.node .port:hover{transform:scale(1.25)}
.chip{position:absolute;display:flex;gap:2px;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 3px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.chip button{border:none;background:transparent;cursor:pointer;padding:1px 5px;border-radius:99px;color:var(--ink)}.chip button:hover{background:rgba(47,111,237,.16)}
.chip .del{display:none;color:#d9534f}.chip:hover .del{display:inline}
#tb{position:absolute;left:12px;top:10px;display:flex;gap:6px;z-index:5}
#tb button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 11px;font-size:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1)}
#tb button:hover{border-color:var(--accent)}
#st{position:absolute;left:12px;bottom:9px;font-size:12px;color:var(--mut);background:var(--panel);padding:4px 10px;border-radius:99px;border:1px solid var(--line);z-index:5}
#help{position:absolute;right:12px;bottom:9px;font-size:11.5px;color:var(--mut);background:var(--panel);padding:5px 11px;border-radius:10px;border:1px solid var(--line);max-width:420px;z-index:5;line-height:1.4}
[data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:60;width:230px;background:#1d2433;color:#fff;font-size:11.5px;line-height:1.35;padding:7px 9px;border-radius:8px;pointer-events:none;font-weight:400}
.port[data-tip]:hover::after{left:auto;right:0;top:-6px;transform:translateY(-100%)}
</style></head>
<body>
<div id="app">
  <div id="pal"><div class="top"><h4>Room library</h4><p>Click a room, or drag it onto the canvas. Each one maps to a type the AI was trained on.</p><input id="q" placeholder="🔎 search rooms…"></div><div id="list"></div></div>
  <div id="cv">
    <svg id="ed"></svg><div id="chips"></div>
    <div id="tb"><button id="bArr" data-tip="Re-arrange all rooms neatly on a circle (only changes this picture, not the floor plan).">↻ Arrange</button></div>
    <div id="st"></div>
    <div id="help">Drag a room by its header · drag the <b style="color:var(--accent)">●</b> dot of one room onto another to connect them · click <b>🚪</b> on a link to switch door ⇄ wall only · <b>✕</b> on hover deletes · <b>🚪 Entrance</b> marks where you enter</div>
  </div>
</div>
<script>
const S = {nodes: [], edges: [], entrance: null, ver: null, presets: [], colors: {}, sel: null, nid: 1, link: null, drag: null, H: 640};
const W = 178, NH = 128;
const $ = id => document.getElementById(id), cv = $("cv"), svg = $("ed"), chips = $("chips");
const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra || {}), "*");
const P = key => S.presets.find(p => p.key === key) || S.presets[0];
const col = t => S.colors[t] || "#999";
function emit() {
  send("streamlit:setComponentValue", {value: {nodes: S.nodes.map(n => ({id: n.id, name: n.name, preset: n.preset, type: n.type, mult: +(+n.mult).toFixed(2), x: Math.round(n.x), y: Math.round(n.y)})),
                                              edges: S.edges.map(e => ({a: e.a, b: e.b, kind: e.kind})), entrance: S.entrance}, dataType: "json"});
}
const nodeById = id => S.nodes.find(n => n.id === id);
const center = n => [n.x + W / 2, n.y + NH / 2];
const hasEdge = (a, b) => S.edges.some(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));

function palette() {
  const q = $("q").value.trim().toLowerCase(), list = $("list"); list.innerHTML = ""; let last = "";
  for (const p of S.presets) {
    if (q && !(p.label.toLowerCase().includes(q) || p.base.includes(q) || p.group.toLowerCase().includes(q))) continue;
    if (p.group !== last) { last = p.group; const g = document.createElement("div"); g.className = "grp"; g.textContent = p.group; list.appendChild(g); }
    const d = document.createElement("div"); d.className = "pi"; d.draggable = true; d.dataset.key = p.key;
    d.setAttribute("data-tip", `${p.label} → AI type “${p.base}”, starting size ×${p.mult}`);
    d.innerHTML = `<i style="background:${col(p.base)}"></i><span>${p.icon} ${p.label}</span><small>×${p.mult}</small>`;
    d.addEventListener("click", () => addNode(p.key));
    d.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", p.key); });
    list.appendChild(d);
  }
}
function freeSpot() {
  for (let k = 0; k < 60; k++) { const x = 30 + (k % 4) * 205, y = 52 + Math.floor(k / 4) * 150;
    if (!S.nodes.some(n => Math.abs(n.x - x) < 150 && Math.abs(n.y - y) < 110)) return [x, y]; }
  return [40, 60];
}
function uniqueName(base) {
  const used = new Set(S.nodes.map(n => n.name.toLowerCase())); if (!used.has(base.toLowerCase())) return base;
  let k = 2; while (used.has((base + " " + k).toLowerCase())) k++; return base + " " + k;
}
function addNode(key, x, y) {
  const p = P(key), [fx, fy] = (x == null) ? freeSpot() : [x - W / 2, y - 20];
  const n = {id: S.nid++, name: uniqueName(p.label), preset: p.key, type: p.base, mult: p.mult, x: Math.max(6, fx), y: Math.max(40, fy)};
  S.nodes.push(n); if (S.entrance == null && p.base === "living") S.entrance = n.id; if (S.entrance == null) S.entrance = n.id;
  S.sel = n.id; build(); emit();
}
function delNode(id) {
  S.nodes = S.nodes.filter(n => n.id !== id); S.edges = S.edges.filter(e => e.a !== id && e.b !== id);
  if (S.entrance === id) { const l = S.nodes.find(n => n.type === "living") || S.nodes[0]; S.entrance = l ? l.id : null; }
  if (S.sel === id) S.sel = null; build(); emit();
}
function connect(a, b) { if (a === b || hasEdge(a, b)) return; S.edges.push({a, b, kind: "door"}); drawEdges(); markIso(); emit(); }

function build() {                                              // (re)create the node DOM from the state
  cv.querySelectorAll(".node").forEach(e => e.remove());
  for (const n of S.nodes) {
    const p = P(n.preset), d = document.createElement("div"); d.className = "node"; d.dataset.id = n.id; d.style.left = n.x + "px"; d.style.top = n.y + "px"; d.style.setProperty("--c", col(n.type));
    const opts = S.presets.map(q => `<option value="${q.key}"${q.key === n.preset ? " selected" : ""}>${q.icon} ${q.label}</option>`).join("");
    d.innerHTML = `<div class="hd"><span class="ico" data-tip="${p.label} → AI type “${n.type}”">${p.icon}</span><input class="nm" maxlength="24" data-tip="Room name (must be unique). Click to rename.">
        <button class="x" data-tip="Delete this room">✕</button></div>
      <div class="bd"><select data-tip="Change what kind of room this is. Each choice maps to one of the 7 types the AI knows.">${opts}</select></div>
      <div class="sz" data-tip="Size relative to a typical room of this type. ×1.0 = typical, ×1.5 = 50% bigger, ×0.6 = 40% smaller."><span>size</span><input type="range" min="0.3" max="2.5" step="0.1"><b></b></div>
      <div class="ft"><button class="ent" data-tip="Mark this room as the entrance: the room you step into from the front door.">🚪 Entrance</button><span class="tag"></span></div>
      <div class="port" data-tip="Drag from this dot onto another room to connect the two."></div>`;
    const nm = d.querySelector(".nm"); nm.value = n.name; const rg = d.querySelector("input[type=range]"); rg.value = n.mult; d.querySelector(".sz b").textContent = "×" + (+n.mult).toFixed(1);
    nm.addEventListener("change", () => { n.name = nm.value.trim() || n.name; nm.value = n.name; emit(); });
    rg.addEventListener("input", () => { n.mult = parseFloat(rg.value); d.querySelector(".sz b").textContent = "×" + n.mult.toFixed(1); });
    rg.addEventListener("change", () => { n.mult = parseFloat(rg.value); emit(); });
    d.querySelector("select").addEventListener("change", e => { const o = P(n.preset), q = P(e.target.value); if (Math.abs(n.mult - o.mult) < 1e-6) n.mult = q.mult;
      n.preset = q.key; n.type = q.base; if (/^(\S+ ?)+$/.test(n.name) && n.name.toLowerCase() === o.label.toLowerCase()) n.name = uniqueName(q.label); build(); emit(); });
    d.querySelector(".x").addEventListener("click", () => delNode(n.id));
    d.querySelector(".ent").addEventListener("click", () => { S.entrance = n.id; build(); emit(); });
    d.querySelector(".hd").addEventListener("mousedown", e => { if (e.target.closest("input,button")) return; S.sel = n.id; S.drag = {id: n.id, dx: pt(e)[0] - n.x, dy: pt(e)[1] - n.y}; markSel(); e.preventDefault(); });
    d.querySelector(".port").addEventListener("mousedown", e => { S.link = {from: n.id, x: pt(e)[0], y: pt(e)[1]}; e.preventDefault(); e.stopPropagation(); });
    d.addEventListener("mousedown", () => { S.sel = n.id; markSel(); });
    cv.appendChild(d);
  }
  markSel(); markIso(); drawEdges(); status();
}
function markSel() { cv.querySelectorAll(".node").forEach(e => e.classList.toggle("sel", +e.dataset.id === S.sel)); }
function markIso() {
  cv.querySelectorAll(".node").forEach(e => { const id = +e.dataset.id, iso = S.nodes.length > 1 && !S.edges.some(x => x.a === id || x.b === id);
    e.classList.toggle("iso", iso); e.querySelector(".tag").textContent = iso ? "⚠ not connected" : ""; e.querySelector(".ent").classList.toggle("on", S.entrance === id); });
  status();
}
function status() { $("st").textContent = `${S.nodes.length} rooms · ${S.edges.length} connections` + (S.nodes.some(n => S.nodes.length > 1 && !S.edges.some(x => x.a === n.id || x.b === n.id)) ? " · ⚠ some rooms are not connected" : ""); }

function drawEdges() {
  const ns = "http://www.w3.org/2000/svg"; svg.innerHTML = ""; chips.innerHTML = "";
  const path = (a, b, dash, w, color) => { const p = document.createElementNS(ns, "path"), dx = Math.max(40, Math.abs(b[0] - a[0]) / 2);
    p.setAttribute("d", `M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}`); p.setAttribute("fill", "none"); p.setAttribute("stroke", color); p.setAttribute("stroke-width", w);
    if (dash) p.setAttribute("stroke-dasharray", dash); p.setAttribute("stroke-linecap", "round"); svg.appendChild(p); };
  for (const e of S.edges) {
    const A = nodeById(e.a), B = nodeById(e.b); if (!A || !B) continue; const a = center(A), b = center(B);
    path(a, b, e.kind === "door" ? null : "7 6", e.kind === "door" ? 3 : 2.2, "#7c8aa5");
    const c = document.createElement("div"); c.className = "chip"; c.style.left = (a[0] + b[0]) / 2 + "px"; c.style.top = (a[1] + b[1]) / 2 + "px";
    c.innerHTML = `<button class="kind" data-tip="${e.kind === "door" ? "DOOR: an opening is cut in the shared wall. Click to make it wall-only." : "WALL ONLY: rooms touch but stay separated. Click to make it a door."}">${e.kind === "door" ? "🚪" : "▭"}</button><button class="del" data-tip="Remove this connection">✕</button>`;
    c.querySelector(".kind").addEventListener("click", () => { e.kind = e.kind === "door" ? "adjacent" : "door"; drawEdges(); emit(); });
    c.querySelector(".del").addEventListener("click", () => { S.edges = S.edges.filter(x => x !== e); drawEdges(); markIso(); emit(); });
    chips.appendChild(c);
  }
  if (S.link) { const A = nodeById(S.link.from); if (A) path(center(A), [S.link.x, S.link.y], "4 5", 2.5, "#2f6fed"); }
}
const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const nodeAt = (x, y) => S.nodes.find(n => x >= n.x && x <= n.x + W && y >= n.y && y <= n.y + NH);
window.addEventListener("mousemove", e => {
  if (S.drag) { const n = nodeById(S.drag.id), [x, y] = pt(e); n.x = Math.max(4, x - S.drag.dx); n.y = Math.max(36, y - S.drag.dy);
    const el = cv.querySelector(`.node[data-id="${n.id}"]`); el.style.left = n.x + "px"; el.style.top = n.y + "px"; drawEdges(); }
  else if (S.link) { [S.link.x, S.link.y] = pt(e); drawEdges(); }
});
window.addEventListener("mouseup", e => {
  if (S.drag) { S.drag = null; emit(); }
  if (S.link) { const [x, y] = pt(e), t = nodeAt(x, y), from = S.link.from; S.link = null; if (t && t.id !== from) connect(from, t.id); else drawEdges(); }
});
cv.addEventListener("dragover", e => e.preventDefault());
cv.addEventListener("drop", e => { e.preventDefault(); const k = e.dataTransfer.getData("text/plain"); if (k) { const [x, y] = pt(e); addNode(k, x, y); } });
window.addEventListener("keydown", e => { if (e.key === "Delete" && S.sel != null && !/INPUT|SELECT/.test((e.target.tagName || ""))) delNode(S.sel); });
$("q").addEventListener("input", palette);
$("bArr").addEventListener("click", () => { const n = S.nodes.length, w = cv.clientWidth || 800, h = cv.clientHeight || 600, R = Math.min(w - W - 40, h - NH - 90) / 2;
  S.nodes.forEach((m, i) => { const a = 2 * Math.PI * i / Math.max(n, 1) - Math.PI / 2; m.x = w / 2 - W / 2 + R * Math.cos(a) * 1.15; m.y = h / 2 - NH / 2 + 10 + R * Math.sin(a) * 0.9; }); build(); emit(); });

window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return; const a = ev.data.args || {};
  S.H = a.height || 640; $("app").style.height = S.H + "px";
  if (a.ver !== S.ver) {
    S.ver = a.ver; S.presets = a.presets || S.presets; S.colors = a.colors || S.colors; const g = a.graph || {nodes: [], edges: []};
    S.nodes = (g.nodes || []).map(n => Object.assign({}, n)); S.edges = (g.edges || []).map(e => Object.assign({}, e)); S.entrance = g.entrance == null ? null : g.entrance;
    S.nid = Math.max(0, ...S.nodes.map(n => n.id)) + 1; S.sel = null; palette(); build();
  }
  send("streamlit:setFrameHeight", {height: S.H + 4});
});
send("streamlit:componentReady", {apiVersion: 1}); send("streamlit:setFrameHeight", {height: S.H + 4});
</script></body></html>
